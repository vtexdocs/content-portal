name: Lighthouse Desktop

on: [pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v1
      - name: Use Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
      - name: Install
        run: |
          yarn install --frozen-lockfile
      - name: Debug PRIVATEKEY format (no secret values printed)
        run: |
          echo "Raw length: ${#GITHUB_PRIVATEKEY}"
          printf '%s' "$GITHUB_PRIVATEKEY" | grep -c 'BEGIN' || echo "0 BEGIN markers found (raw)"
          printf '%s' "$GITHUB_PRIVATEKEY" | grep -o '\\\\n' | wc -l | xargs echo "Literal \\n sequences found:"
          printf '%s\n' "$GITHUB_PRIVATEKEY" | wc -l | xargs echo "Real newlines found:"
          printf '%s' "$GITHUB_PRIVATEKEY" | sed 's/\\n/\n/g' > /tmp/debug.pem
          echo "Lines after sed: $(wc -l < /tmp/debug.pem)"
          echo "BEGIN markers after sed: $(grep -c 'BEGIN' /tmp/debug.pem || echo 0)"
          echo "END markers after sed: $(grep -c 'END' /tmp/debug.pem || echo 0)"
          rm -f /tmp/debug.pem
        env:
          GITHUB_PRIVATEKEY: ${{ secrets.PRIVATEKEY }}
      - name: Build
        run: |
          yarn run build
        env:
          GITHUB_PRIVATEKEY: ${{ secrets.PRIVATEKEY }}
          GITHUB_APPID: ${{ secrets.APPID }}
          GITHUB_INSTALLATIONID: ${{ secrets.INSTALLATIONID }}
      - name: Waiting for 200 from the Netlify Preview
        uses: kamranayub/wait-for-netlify-action@2.0.0
        id: wait-for-netflify-preview
        with:
          site_name: 'language-hub'
        env:
          NETLIFY_TOKEN: ${{secrets.NETLIFY_TOKEN}}
      - name: Lighthouse CI
        run: |
          yarn global add @lhci/cli@0.8.x
          lhci autorun --upload.target=temporary-public-storage --collect.url=${{ steps.wait-for-netflify-preview.outputs.url }} --collect.settings.preset="desktop" || echo "LHCI failed!"
        env:
          LHCI_GITHUB_TOKEN: ${{ secrets.LHCI_GITHUB_TOKEN }}
